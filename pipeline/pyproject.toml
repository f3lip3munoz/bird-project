[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aves"
version = "0.1.0"
description = "Base de datos de observaciones de aves de Chile"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
aves = "aves.cli:main"

[tool.setuptools]
packages = ["aves"]

[tool.setuptools.package-data]
aves = ["schema.sql"]
